[package]
name = "color-signal-lens"
version = "0.1.0"
description = "A private reading lens for status colours"
authors = ["Param Factory"]
edition = "2021"

[lib]
name = "color_signal_lens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = "0.24"
screenshots = "0.8"
