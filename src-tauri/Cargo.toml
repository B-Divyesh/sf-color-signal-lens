[package]
name = "color-signal-lens"
version = "0.1.10"
description = "A private reading lens for status colours"
authors = ["Param Factory"]
edition = "2021"

[lib]
name = "color_signal_lens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
