name: Release desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - os: macos-latest
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
          - os: windows-latest
            args: ''
            target: ''
          - os: ubuntu-22.04
            args: ''
            target: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cross-compilation target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}
      - name: Install Linux package tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Color Signal Lens ${{ github.ref_name }}
          releaseBody: Private desktop build. Unsigned installers may require an OS confirmation.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  release-manifest:
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Publish checksums and platform manifest after every build is attached
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download "$GITHUB_REF_NAME" --pattern '*' --dir release-assets
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS ! -name latest.json -printf '%f\n' | sort | while IFS= read -r file; do sha256sum "$file"; done > SHA256SUMS
          jq -n \
            --arg version "$GITHUB_REF_NAME" \
            --arg release "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            --arg base "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" \
            --arg mac "$(find . -maxdepth 1 -type f -iname '*.dmg' -printf '%f\n' | head -n1)" \
            --arg windows "$(find . -maxdepth 1 -type f \( -iname '*.msi' -o -iname '*.exe' \) -printf '%f\n' | head -n1)" \
            --arg linux "$(find . -maxdepth 1 -type f \( -iname '*.AppImage' -o -iname '*.deb' \) -printf '%f\n' | head -n1)" \
            '{version: $version, release: $release, downloads: {macos: ($base + $mac), windows: ($base + $windows), linux: ($base + $linux)}}' > latest.json
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS latest.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
